<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>分镜台 · AI 剧本分镜助手</title>
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231B1917'/><path d='M8 10h16M8 16h10M8 22h16' stroke='%23F4F0E6' stroke-width='2.5' stroke-linecap='round'/></svg>" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="2.5" y="4.5" width="19" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="M7 8.5h6M7 12h10M7 15.5h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <div class="brand__text">
      <strong>分镜台</strong>
      <span>STORYBOARD BENCH</span>
    </div>
  </div>

  <div class="topbar__mid" id="statusChip" hidden></div>

  <nav class="topbar__actions">
    <button class="btn btn--ghost" id="btnExportCsv" disabled>CSV</button>
    <button class="btn btn--ghost" id="btnExportXls" disabled>Excel</button>
    <button class="btn btn--ghost" id="btnExportJson" disabled>JSON</button>
    <button class="btn btn--ghost" id="btnExportDocx" disabled>Word</button>
    <button class="btn btn--solid" id="btnPrint" disabled>打印分镜本</button>
  </nav>
</header>

<main class="workspace">

  <!-- 左：剧本 -->
  <aside class="panel panel--script">
    <div class="panel__head">
      <h2>剧本</h2>
      <span class="hint" id="scriptCount">0 字</span>
    </div>

    <div class="ep-bar">
      <span class="ep-bar__label">分集</span>
      <select id="epSelect" title="切换集"></select>
      <input id="epNo" maxlength="3" value="01" title="集号，镜号前缀" />
      <input id="epName" placeholder="集名" title="这一集叫什么" />
      <button class="btn btn--ghost" id="btnEpNew" title="新建一集">＋</button>
    </div>

    <div class="uploader" id="uploader" role="button" tabindex="0" title="点击选择文件，或把文件拖到这里">
      <span class="uploader__icon">↑</span>
      <span class="uploader__title">上传剧本文件</span>
      <span class="uploader__hint">.docx / .txt · 也可直接拖进来</span>
      <input type="file" id="fileInput" accept=".docx,.txt,text/plain" hidden />
    </div>

    <div class="file-chip" id="fileChip" hidden>
      <span id="fileName"></span>
      <span class="file-chip__meta" id="fileMeta"></span>
      <button class="file-chip__x" id="btnClearFile" title="移除">×</button>
    </div>

    <div class="or-row"><span>或直接粘贴文本</span></div>

    <textarea id="script" class="script-input" spellcheck="false"
      placeholder="把剧本片段粘在这里…"></textarea>

    <div class="samples-row">
      <span class="samples-row__label">没有剧本？载入</span>
      <div class="script-samples" id="samples"></div>
    </div>

    <div class="divider"></div>

    <div class="options">
      <div class="field">
        <label for="optStyle">视觉风格</label>
        <select id="optStyle">
          <option value="电影感写实" selected>电影感写实</option>
          <option value="日式赛璐璐">日式赛璐璐</option>
          <option value="国漫厚涂">国漫厚涂</option>
          <option value="竖屏条漫">竖屏条漫</option>
          <option value="__custom">自定义…</option>
        </select>
        <input id="optStyleCustom" class="field__custom" placeholder="例如：水墨动画" hidden />
      </div>
      <div class="field">
        <label for="optAspect">画幅</label>
        <select id="optAspect">
          <option value="9:16" selected>9:16 竖屏</option>
          <option value="16:9">16:9 横屏</option>
          <option value="2.39:1">2.39:1 宽银幕</option>
          <option value="__custom">自定义…</option>
        </select>
        <input id="optAspectCustom" class="field__custom" placeholder="例如：4:3" hidden />
      </div>
      <div class="field">
        <label for="optLang">台词</label>
        <select id="optLang">
          <option value="" selected>仅中文</option>
          <option value="泰语">中泰双语</option>
          <option value="英语">中英双语</option>
          <option value="英语+泰语">中英泰三语</option>
          <option value="__custom">自定义…</option>
        </select>
        <input id="optLangCustom" class="field__custom" placeholder="例如：日语" hidden />
      </div>
      <div class="field">
        <label for="optDur">目标时长</label>
        <select id="optDur">
          <option value="0" selected>自然长度</option>
          <option value="30">约 30 秒</option>
          <option value="60">约 60 秒</option>
          <option value="90">约 90 秒</option>
          <option value="__custom">自定义…</option>
        </select>
        <input id="optDurCustom" class="field__custom" type="number" min="5" max="600" placeholder="秒" hidden />
      </div>
    </div>

    <details class="notes" id="notesBox">
      <summary>导演意见（可选）</summary>
      <textarea id="notes" rows="3" placeholder="例：第 2 场再压一点；单镜别超过 4 秒；台词不要长句"></textarea>
    </details>

    <button class="btn btn--generate" id="btnGenerate">
      <span>拆解分镜</span>
      <kbd>⌘ ↵</kbd>
    </button>

    <div class="feedback" id="feedbackBox" hidden>
      <label for="feedback">哪里不对？写一句，按你的意见重做</label>
      <textarea id="feedback" rows="2" placeholder="例：第 3 镜太长，拆成两镜；Mint 的表情再冷一点"></textarea>
      <button class="btn btn--solid" id="btnRevise">按意见重做</button>
    </div>

    <div class="progress" id="progress" hidden>
      <div class="progress__step" data-step="bible"><i></i><span>建立角色 / 服装 / 场景 / 道具资产</span></div>
      <div class="progress__step" data-step="shots"><i></i><span>按场景拆解镜头</span></div>
      <div class="progress__step" data-step="done"><i></i><span>校准时长与运镜</span></div>
    </div>

    <p class="footnote" id="demoNote" hidden>演示模式：未配置密钥，显示的是内置示例结果。</p>
  </aside>

  <!-- 中：分镜 -->
  <section class="panel panel--board">
    <div class="board__head" id="boardHead" hidden>
      <div class="stats" id="stats"></div>
      <div class="viewswitch" id="viewSwitch">
        <button class="is-active" data-view="table">表格</button>
        <button data-view="cards">卡片</button>
      </div>
    </div>

    <div class="empty" id="emptyState">
      <div class="empty__frame" aria-hidden="true">
        <svg viewBox="0 0 320 180">
          <rect x="8" y="8" width="304" height="164" rx="4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 5"/>
          <path d="M60 60h70M60 84h120M60 108h90" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
          <path d="M214 48v84M240 48v84M266 48v84" stroke="currentColor" stroke-width="1" opacity=".28"/>
        </svg>
      </div>
      <h3>还是一片空白</h3>
      <p>左边粘一段剧本，或者在下面载入一个示例。<br/>点「拆解分镜」之后，会先建人物 / 场景 / 道具档案，再逐场拆镜头，最后用规则校准时长与运镜。</p>
      <button class="btn btn--ghost" id="btnTrySample" style="margin-top:16px">载入示例并生成 →</button>
    </div>

    <div class="board__body" id="boardBody" hidden></div>
  </section>

  <!-- 右：检视器 -->
  <aside class="panel panel--inspector">
    <div class="tabs" id="tabs">
      <button class="is-active" data-tab="bible">资产</button>
      <button data-tab="unity">统一</button>
      <button data-tab="check">一致性 <em id="warnBadge" hidden>0</em></button>
    </div>
    <div class="inspector__body" id="inspectorBody">
      <p class="placeholder-note">生成后显示角色、服装、场景、道具资产。</p>
    </div>
  </aside>

</main>

<div class="toast" id="toast" hidden></div>

<!-- 二级页面：点卡片/行进来，看大图、改提示词、写建议修改、出图 -->
<div class="detail" id="detail" hidden>
  <div class="detail__mask" data-close="1"></div>
  <section class="detail__panel" role="dialog" aria-modal="true">
    <header class="detail__head">
      <span class="detail__kind" id="detailKind"></span>
      <h3 id="detailTitle">—</h3>
      <button class="detail__x" id="detailClose" title="关闭">×</button>
    </header>

    <div class="detail__grid">
      <div class="detail__media">
        <div class="detail__fig" id="detailFig"><span class="detail__empty">还没有图</span></div>
        <div class="detail__refs" id="detailRefs" hidden></div>
      </div>

      <div class="detail__side">
        <div class="detail__fields" id="detailFields" hidden></div>

        <div class="detail__advice">
          <input id="detailRevise" placeholder="建议修改：换成白天 / 表情再冷一点 / 镜头再低一点" />
          <button class="btn btn--solid" id="detailGen">生成预览</button>
        </div>
        <p class="detail__tip" id="detailTip">多视图出图约 60–90 秒。</p>

        <label class="detail__label" for="detailPrompt">画面提示词（可改，改完再点生成）</label>
        <textarea id="detailPrompt" rows="6" spellcheck="false"></textarea>
      </div>
    </div>
  </section>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
